<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Dhaatu — Pure Indian Brass Jewellery</title>
  <meta name="description" id="page-desc" content="Handcrafted brass jewellery rooted in age-old Indian craft." />

  <!-- Razorpay -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ─── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }
    button { cursor: pointer; font-family: inherit; }

    /* ─── Design tokens ──────────────────────────────────── */
    :root {
      --gold:          #B8965A;
      --gold-light:    #D4AF7A;
      --gold-dark:     #8B6D3A;
      --cream:         #F9F5EF;
      --cream-alt:     #F0E8D8;
      --dark:          #1A1410;
      --ink:           #3A2E24;
      --muted:         #7A6A58;
      --border:        rgba(184, 150, 90, 0.2);
      --border-strong: rgba(184, 150, 90, 0.45);
      --font-serif:    'Cormorant Garamond', Georgia, serif;
      --font-sans:     'DM Sans', system-ui, sans-serif;
      --transition:    0.22s ease;
      --radius-sm:     2px;
    }

    /* ─── Base ───────────────────────────────────────────── */
    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Announcement bar ───────────────────────────────── */
    #announcement-bar {
      background: var(--gold);
      color: #fff;
      text-align: center;
      padding: 7px 1rem;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* ─── Navigation ─────────────────────────────────────── */
    #nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(249, 245, 239, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 0.5px solid var(--border);
      height: 62px;
      padding: 0 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #nav-logo {
      font-family: var(--font-serif);
      font-size: 23px;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dark);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a,
    .nav-links button {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      background: none;
      border: none;
      transition: color var(--transition);
    }
    .nav-links a:hover,
    .nav-links button:hover { color: var(--gold); }

    #cart-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      padding: 0;
    }

    #cart-trigger svg { flex-shrink: 0; }

    #cart-badge {
      background: var(--dark);
      color: var(--cream);
      font-size: 10px;
      font-weight: 500;
      min-width: 19px;
      height: 19px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition);
    }
    #cart-badge.has-items { background: var(--gold); }

    /* ─── Hero ───────────────────────────────────────────── */
    #hero {
      padding: 5.5rem 2rem 5rem;
      text-align: center;
      background: linear-gradient(180deg, var(--cream-alt) 0%, var(--cream) 100%);
      border-bottom: 0.5px solid var(--border);
    }

    .hero-eyebrow {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.25rem;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(40px, 6vw, 72px);
      font-weight: 300;
      line-height: 1.08;
      color: var(--dark);
      letter-spacing: 0.015em;
      margin-bottom: 1.125rem;
    }
    .hero-title em {
      font-style: italic;
      color: var(--gold-dark);
    }

    .hero-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.85;
      letter-spacing: 0.04em;
      max-width: 420px;
      margin: 0 auto 2.25rem;
    }

    .btn-outline {
      display: inline-block;
      padding: 12px 38px;
      border: 1px solid var(--gold);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      background: transparent;
      transition: background var(--transition), color var(--transition);
      font-family: var(--font-sans);
    }
    .btn-outline:hover { background: var(--gold); color: #fff; }

    /* ─── Section header ─────────────────────────────────── */
    .section-header {
      padding: 4rem 2rem 2.25rem;
      text-align: center;
    }

    .section-eyebrow {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.6rem;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 30px;
      font-weight: 300;
      color: var(--dark);
      letter-spacing: 0.04em;
    }

    /* ─── Product grid ───────────────────────────────────── */
    #catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.5rem;
      padding: 0 2rem 5rem;
    }

    .product-card {
      background: #fff;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 36px rgba(184, 150, 90, 0.13);
    }

    .product-img-wrap {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--cream-alt);
      overflow: hidden;
    }

    .product-img-wrap img {
      transition: transform 0.4s ease;
    }
    .product-card:hover .product-img-wrap img {
      transform: scale(1.04);
    }

    .product-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 52px;
      color: var(--gold);
      opacity: 0.3;
      user-select: none;
    }

    .product-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--gold);
      color: #fff;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 3px 9px;
    }

    .product-info {
      padding: 1rem 1.125rem 1.25rem;
    }

    .product-name {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 400;
      color: var(--dark);
      letter-spacing: 0.02em;
      margin-bottom: 3px;
    }

    .product-material {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .product-price {
      font-family: var(--font-serif);
      font-size: 21px;
      font-weight: 300;
    }

    .btn-add {
      background: var(--dark);
      color: var(--cream);
      border: none;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 8px 16px;
      font-family: var(--font-sans);
      transition: background var(--transition);
    }
    .btn-add:hover { background: var(--gold-dark); }

    /* ─── Craft strip ────────────────────────────────────── */
    #craft-strip {
      background: var(--dark);
      text-align: center;
      padding: 5rem 2rem;
    }

    .craft-eyebrow {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .craft-title {
      font-family: var(--font-serif);
      font-size: 30px;
      font-weight: 300;
      font-style: italic;
      color: var(--cream);
      line-height: 1.5;
      margin-bottom: 1.125rem;
    }

    .craft-body {
      font-size: 13px;
      color: #8B7B6A;
      max-width: 460px;
      margin: 0 auto;
      line-height: 1.95;
      letter-spacing: 0.03em;
    }

    /* ─── Footer ─────────────────────────────────────────── */
    footer {
      padding: 2rem 2.5rem;
      border-top: 0.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .footer-logo {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .footer-meta {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .footer-meta a {
      color: var(--gold);
      text-decoration: none;
    }
    .footer-meta a:hover { text-decoration: underline; }

    /* ─── Product modal ──────────────────────────────────── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(26, 20, 16, 0.72);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #modal-overlay.open { display: flex; }

    #modal {
      background: var(--cream);
      max-width: 660px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
    }

    #modal-img-wrap {
      aspect-ratio: 4 / 3;
      background: var(--cream-alt);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal gallery thumbnails */
    .modal-gallery { display:flex; flex-direction:column; gap:12px; }
    .modal-gallery #modal-main-img { width:100%; height:auto; object-fit:cover; }
    .modal-thumbs { display:flex; gap:8px; justify-content:center; }
    .modal-thumb { width:64px; height:64px; object-fit:cover; cursor:pointer; border:2px solid transparent; }
    .modal-thumb:hover, .modal-thumb:focus { border-color: var(--gold); }

    .modal-placeholder {
      font-family: var(--font-serif);
      font-size: 80px;
      color: var(--gold);
      opacity: 0.25;
    }

    #modal-body { padding: 2rem 2.25rem 2.25rem; }

    #modal-material {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }

    #modal-name {
      font-family: var(--font-serif);
      font-size: 30px;
      font-weight: 300;
      color: var(--dark);
      margin-bottom: 1.25rem;
    }

    #modal-desc {
      font-size: 14px;
      line-height: 1.85;
      color: var(--muted);
      padding-top: 1.25rem;
      border-top: 0.5px solid var(--border);
      margin-bottom: 1.5rem;
    }

    #modal-price {
      font-family: var(--font-serif);
      font-size: 30px;
      font-weight: 300;
      margin-bottom: 1.75rem;
    }

    #modal-actions { display: flex; gap: 12px; }

    #modal-close {
      background: none;
      border: 1px solid var(--border-strong);
      color: var(--muted);
      padding: 13px 20px;
      font-size: 17px;
      line-height: 1;
      transition: border-color var(--transition), color var(--transition);
    }
    #modal-close:hover { border-color: var(--gold); color: var(--gold); }

    #modal-add {
      flex: 1;
      background: var(--dark);
      color: var(--cream);
      border: none;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-family: var(--font-sans);
      padding: 14px;
      transition: background var(--transition);
    }
    #modal-add:hover { background: var(--gold-dark); }

    /* ─── Cart drawer ────────────────────────────────────── */
    #cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(390px, 100vw);
      z-index: 300;
      background: var(--cream);
      border-left: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }
    #cart-drawer.open { transform: translateX(0); }

    #cart-header {
      padding: 1.5rem 1.75rem 1.125rem;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #cart-title {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.06em;
    }

    #cart-close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      padding: 2px;
      transition: color var(--transition);
    }
    #cart-close-btn:hover { color: var(--dark); }

    #cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 1.75rem;
    }

    .cart-empty-msg {
      text-align: center;
      padding: 3.5rem 1rem;
      font-family: var(--font-serif);
      font-size: 16px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.7;
    }

    .cart-line {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      padding: 1rem 0;
      border-bottom: 0.5px solid var(--border);
    }

    .cart-line-thumb {
      width: 66px;
      height: 66px;
      flex-shrink: 0;
      background: var(--cream-alt);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-thumb-placeholder {
      font-family: var(--font-serif);
      font-size: 22px;
      color: var(--gold);
      opacity: 0.45;
    }

    .cart-line-info { flex: 1; min-width: 0; }

    .cart-line-name {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 400;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-line-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .cart-qty-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .qty-btn {
      background: none;
      border: 0.5px solid var(--border-strong);
      color: var(--ink);
      width: 24px;
      height: 24px;
      font-size: 15px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--transition);
    }
    .qty-btn:hover { border-color: var(--gold); }

    .qty-value {
      font-size: 13px;
      font-weight: 500;
      min-width: 16px;
      text-align: center;
    }

    .cart-line-remove {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 17px;
      padding: 2px;
      line-height: 1;
      align-self: flex-start;
      transition: color var(--transition);
    }
    .cart-line-remove:hover { color: #A32D2D; }

    #cart-footer {
      padding: 1.25rem 1.75rem 1.5rem;
      border-top: 0.5px solid var(--border);
    }

    #cart-summary {
      margin-bottom: 1.125rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .summary-label {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .summary-value { font-size: 13px; }

    .summary-row.total .summary-label {
      font-size: 13px;
      color: var(--ink);
    }

    .summary-row.total .summary-value {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 300;
    }

    #checkout-btn {
      width: 100%;
      background: var(--dark);
      color: var(--cream);
      border: none;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-family: var(--font-sans);
      padding: 15px;
      transition: background var(--transition);
      margin-bottom: 8px;
    }
    #checkout-btn:hover:not(:disabled) { background: var(--gold-dark); }
    #checkout-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .secure-note {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.05em;
    }

    /* ─── Toast ──────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--dark);
      color: var(--cream);
      padding: 9px 24px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: var(--radius-sm);
      z-index: 500;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ─── Overlay backdrop ───────────────────────────────── */
    #backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 250;
      background: rgba(26, 20, 16, 0.4);
    }
    #backdrop.open { display: block; }

    /* ─── Entrance animation ─────────────────────────────── */
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .product-card {
      animation: rise 0.4s ease both;
    }

    /* ─── Responsive ─────────────────────────────────────── */
    @media (max-width: 600px) {
      #nav { padding: 0 1.25rem; }
      #hero { padding: 4rem 1.25rem 3.5rem; }
      #catalog { padding: 0 1rem 4rem; gap: 1rem; }
      .section-header { padding: 3rem 1.25rem 1.75rem; }
      footer { padding: 1.5rem 1.25rem; }
      .nav-links { gap: 1.25rem; }
    }
  </style>
</head>

<body>

      },
      {

        desc:     "Wide disc earrings with engraved geometric patterns drawn from tribal Indian motifs. Each one is finished by hand — no two pieces are identical. A collector's piece.",
      },
    ],
  };
</script>

<div id="toast" role="status" aria-live="polite"></div>

<!-- ─────────────────────────────────────────────────────────
     APPLICATION LOGIC
──────────────────────────────────────────────────────────── -->
<script>
  /* ── State ────────────────────────────────────────────── */
  const state = {
    cart: [],          /* [{ product, qty }] */
    activeProduct: null,
    toastTimer: null,
  };

  /* ── Helpers ──────────────────────────────────────────── */
  const fmt = (n) => `₹${n.toLocaleString('en-IN')}`;

  const $ = (id) => document.getElementById(id);

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('visible');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => el.classList.remove('visible'), 2400);
  }

  /* ── Boot: populate static content from SITE config ───── */
  function boot() {
    document.title = `${SITE.brand.name} — ${SITE.brand.tagline}`;
    $('page-title') && ($('page-title').textContent = document.title);
    $('page-desc') && ($('page-desc').setAttribute('content', SITE.brand.description));

    const bar = $('announcement-bar');
    if (SITE.announcement) {
      bar.textContent = SITE.announcement;
    } else {
      bar.style.display = 'none';
    }

    $('nav-logo').textContent = SITE.brand.name;
    $('hero-eyebrow').textContent = SITE.brand.tagline;
    $('hero-sub').textContent   = SITE.brand.description;

    $('craft-eyebrow').textContent = SITE.craft.eyebrow;
    $('craft-title').textContent   = `"${SITE.craft.quote}"`;
    $('craft-body').textContent    = SITE.craft.body;

    $('footer-logo').textContent = SITE.brand.name;
    $('footer-meta').innerHTML   =
      `<a href="${SITE.brand.instagram}" target="_blank" rel="noopener">Instagram</a>
       &nbsp;·&nbsp;
       <a href="${SITE.brand.whatsapp}" target="_blank" rel="noopener">WhatsApp</a>`;
    $('footer-copy').textContent = `© ${SITE.brand.year} ${SITE.brand.name}`;

    renderCatalog();
    bindEvents();
  }

  /* ── Catalog ──────────────────────────────────────────── */
  function renderCatalog() {
    $('catalog').innerHTML = SITE.products.map((p, i) => `
      <article
        class="product-card"
        style="animation-delay: ${i * 0.07}s"
        role="button"
        tabindex="0"
        aria-label="View ${p.name}"
        data-id="${p.id}"
      >
        <div class="product-img-wrap">
          ${p.image
            ? (Array.isArray(p.image)
                ? `<img src="${p.image[0]}" alt="${p.name}" loading="lazy" />`
                : `<img src="${p.image}" alt="${p.name}" loading="lazy" />`)
            : `<div class="product-placeholder" aria-hidden="true">${p.icon}</div>`}
          ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
        </div>
        <div class="product-info">
          <p class="product-name">${p.name}</p>
          <p class="product-material">${p.material}</p>
          <div class="product-footer">
            <span class="product-price">${fmt(p.price)}</span>
            <button class="btn-add" data-action="add" data-id="${p.id}">Add</button>
          </div>
        </div>
      </article>
    `).join('');
  }

  /* ── Modal ────────────────────────────────────────────── */
  function openModal(id) {
    const p = SITE.products.find(x => x.id === id);
    if (!p) return;
    state.activeProduct = p;

    if (p.image) {
      if (Array.isArray(p.image)) {
        $('modal-img-wrap').innerHTML = `
          <div class="modal-gallery">
            <img id="modal-main-img" src="${p.image[0]}" alt="${p.name}" />
            <div class="modal-thumbs">
              ${p.image.map(src => `<img class="modal-thumb" src="${src}" data-src="${src}" alt="${p.name} thumb" />`).join('')}
            </div>
          </div>
        `;
      } else {
        $('modal-img-wrap').innerHTML = `<img id="modal-main-img" src="${p.image}" alt="${p.name}" />`;
      }
    } else {
      $('modal-img-wrap').innerHTML = `<div class="modal-placeholder" aria-hidden="true">${p.icon}</div>`;
    }

    $('modal-material').textContent = p.material;
    $('modal-name').textContent     = p.name;
    $('modal-desc').textContent     = p.desc;
    $('modal-price').textContent    = fmt(p.price);

    $('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    $('modal-overlay').classList.remove('open');
    if (!$('cart-drawer').classList.contains('open')) {
      document.body.style.overflow = '';
    }
    state.activeProduct = null;
  }

  /* ── Cart ─────────────────────────────────────────────── */
  function addToCart(id) {
    const p = SITE.products.find(x => x.id === id);
    if (!p) return;
    const line = state.cart.find(l => l.product.id === id);
    if (line) {
      line.qty += 1;
    } else {
      state.cart.push({ product: p, qty: 1 });
    }
    syncCart();
    toast(`${p.name} added`);
  }

  function updateQty(id, delta) {
    const idx = state.cart.findIndex(l => l.product.id === id);
    if (idx === -1) return;
    state.cart[idx].qty += delta;
    if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
    syncCart();
  }

  function syncCart() {
    const count    = state.cart.reduce((s, l) => s + l.qty, 0);
    const subtotal = state.cart.reduce((s, l) => s + l.product.price * l.qty, 0);
    const shipping = subtotal > 0 && subtotal < 999 ? 99 : 0;
    const total    = subtotal + shipping;

    /* Badge */
    const badge = $('cart-badge');
    badge.textContent = count;
    badge.classList.toggle('has-items', count > 0);

    /* Summary */
    $('summary-subtotal').textContent = fmt(subtotal);
    $('summary-shipping').textContent = shipping === 0 ? 'Free' : fmt(shipping);
    $('summary-total').textContent    = fmt(total);

    /* Checkout button */
    $('checkout-btn').disabled = state.cart.length === 0;

    /* Line items */
    const list = $('cart-items');
    if (state.cart.length === 0) {
      list.innerHTML = `<p class="cart-empty-msg">Your cart is empty.<br>Add a piece to begin.</p>`;
      return;
    }

    list.innerHTML = state.cart.map(({ product: p, qty }) => `
      <div class="cart-line">
        <div class="cart-line-thumb">
          ${p.image
            ? (Array.isArray(p.image)
                ? `<img src="${p.image[0]}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;" />`
                : `<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;" />`)
            : `<span class="cart-thumb-placeholder" aria-hidden="true">${p.icon}</span>`}
        </div>
        <div class="cart-line-info">
          <p class="cart-line-name">${p.name}</p>
          <p class="cart-line-sub">${fmt(p.price)} each</p>
          <div class="cart-qty-row">
            <button class="qty-btn" data-action="dec" data-id="${p.id}" aria-label="Decrease quantity">−</button>
            <span class="qty-value">${qty}</span>
            <button class="qty-btn" data-action="inc" data-id="${p.id}" aria-label="Increase quantity">+</button>
          </div>
        </div>
        <button class="cart-line-remove" data-action="remove" data-id="${p.id}" aria-label="Remove ${p.name}">✕</button>
      </div>
    `).join('');
  }

  function openCart() {
    $('cart-drawer').classList.add('open');
    $('backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeCart() {
    $('cart-drawer').classList.remove('open');
    $('backdrop').classList.remove('open');
    if (!$('modal-overlay').classList.contains('open')) {
      document.body.style.overflow = '';
    }
  }

  /* ── Checkout (Razorpay) ──────────────────────────────── */
  function initiateCheckout() {
    if (state.cart.length === 0) return;

    const subtotal = state.cart.reduce((s, l) => s + l.product.price * l.qty, 0);
    const shipping = subtotal < 999 ? 99 : 0;
    const total    = subtotal + shipping;

    const options = {
      key:         SITE.razorpay.key,
      amount:      total * 100,          /* paise */
      currency:    SITE.razorpay.currency,
      name:        SITE.brand.name,
      description: `${state.cart.length} item${state.cart.length > 1 ? 's' : ''}`,
      handler: function (response) {
        /* On success: clear cart, show confirmation */
        state.cart = [];
        syncCart();
        closeCart();
        toast('Order confirmed ✦ Check WhatsApp for updates');
      },
      theme: {
        color: '#B8965A',
      },
      modal: {
        ondismiss: function () {
          toast('Payment cancelled');
        },
      },
    };

    if (typeof Razorpay !== 'undefined' && SITE.razorpay.key !== 'YOUR_RAZORPAY_KEY_ID') {
      const rzp = new Razorpay(options);
      rzp.open();
    } else {
      toast('Add your Razorpay key in SITE config to go live');
    }
  }

  /* ── Event delegation ─────────────────────────────────── */
  function bindEvents() {
    /* Catalog: open modal on card click, add on button click */
    $('catalog').addEventListener('click', (e) => {
      const addBtn = e.target.closest('[data-action="add"]');
      const card   = e.target.closest('.product-card');
      if (addBtn) {
        e.stopPropagation();
        addToCart(addBtn.dataset.id);
        return;
      }
      if (card) openModal(card.dataset.id);
    });

    $('catalog').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const card = e.target.closest('.product-card');
        if (card) openModal(card.dataset.id);
      }
    });

    /* Modal */
    $('modal-overlay').addEventListener('click', (e) => {
      if (e.target === $('modal-overlay')) closeModal();
    });
    $('modal-close').addEventListener('click', closeModal);
    $('modal-add').addEventListener('click', () => {
      if (state.activeProduct) {
        addToCart(state.activeProduct.id);
        closeModal();
      }
    });

    /* Modal: thumbnail click to swap main image */
    $('modal-img-wrap').addEventListener('click', (e) => {
      const t = e.target;
      if (t && t.classList && t.classList.contains('modal-thumb')) {
        const main = document.getElementById('modal-main-img');
        if (main) main.src = t.dataset.src;
      }
    });

    /* Cart trigger */
    $('cart-trigger').addEventListener('click', openCart);
    $('cart-close-btn').addEventListener('click', closeCart);
    $('backdrop').addEventListener('click', closeCart);

    /* Cart line actions (qty +/−, remove) */
    $('cart-items').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const { action, id } = btn.dataset;
      if (action === 'inc')    updateQty(id, +1);
      if (action === 'dec')    updateQty(id, -1);
      if (action === 'remove') { state.cart = state.cart.filter(l => l.product.id !== id); syncCart(); }
    });

    /* Checkout */
    $('checkout-btn').addEventListener('click', initiateCheckout);

    /* Keyboard: close modal/cart on Escape */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if ($('modal-overlay').classList.contains('open')) closeModal();
        else if ($('cart-drawer').classList.contains('open')) closeCart();
      }
    });
  }

  /* ── Init ─────────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', boot);
</script>

</body>
